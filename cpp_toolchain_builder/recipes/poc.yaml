# POC component versions and build options; see docs/poc-parity.md.
libraries:
- name: binutils
  version: '2.45'
  stage: core
  source:
    url: https://ftpmirror.gnu.org/gnu/binutils/binutils-2.45.tar.gz
    filename: binutils-2.45.tar.gz
    sha256: 8a3eb4b10e7053312790f21ee1a38f7e2bbd6f4096abb590d3429e5119592d96
  depends_on: []
  build:
    system: autotools
    options:
    - --build=x86_64-linux-gnu
    - --host=x86_64-linux-gnu
    - --enable-ld=default
    - --enable-gold
    - --enable-lto
    - --enable-plugins
    - --enable-shared
    - --enable-threads
    - --with-system-zlib
    - --enable-deterministic-archives
    - --disable-compressed-debug-sections
    - --enable-new-dtags
    - --disable-werror
  artifacts:
  - bin/ld.gold
  - bin/ld
  - bin/ar
  environment:
    CC: gcc
    CXX: g++
    CFLAGS: -g -O2
    CXXFLAGS: -g -O2
    LDFLAGS: ''
- name: gcc
  version: 15.2.0
  stage: core
  source:
    url: https://ftpmirror.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.gz
    filename: gcc-15.2.0.tar.gz
    sha256: 7294d65cc1a0558cb815af0ca8c7763d86f7a31199794ede3f630c0d1b0a5723
  depends_on:
  - binutils
  build:
    system: autotools
    options:
    - -v
    - --build=x86_64-linux-gnu
    - --host=x86_64-linux-gnu
    - --target=x86_64-linux-gnu
    - --disable-multilib
    - --with-system-zlib
    - --enable-checking=release
    - --enable-languages=c,c++,fortran
    - --enable-gold=yes
    - --enable-ld=yes
    - --enable-lto
    - --enable-bootstrap
    - --disable-vtable-verify
    - --disable-werror
    - --without-included-gettext
    - --enable-threads=posix
    - --enable-nls
    - --enable-clocale=gnu
    - --enable-libstdcxx-debug
    - --enable-libstdcxx-time=yes
    - --enable-gnu-unique-object
    - --enable-plugin
    - --enable-default-pie
    - --with-target-system-zlib
    - --with-tune=generic
    - --without-cuda-driver
    prepare:
    - - ./contrib/download_prerequisites
    after:
    - hook: gcc_math
  artifacts:
  - bin/gcc
  - bin/g++
  - bin/gfortran
  - lib/libgmp.a
  - lib/libmpfr.a
- name: gdb
  version: '16.1'
  stage: core
  source:
    url: https://ftpmirror.gnu.org/gnu/gdb/gdb-16.1.tar.gz
    filename: gdb-16.1.tar.gz
    sha256: ff2cfff60546a3851561ddac7c012a7c184bb95b66286ae332d16880f77247c9
  depends_on:
  - gcc
  build:
    system: autotools
    options:
    - --build=x86_64-linux-gnu
    - --host=x86_64-linux-gnu
    - --disable-maintainer-mode
    - --disable-dependency-tracking
    - --disable-silent-rules
    - --disable-gdbtk
    - --disable-shared
    - --without-guile
    - --with-system-gdbinit=${prefix}/etc/gdb/gdbinit
    - --with-system-readline
    - --with-expat
    - --with-system-zlib
    - --with-lzma
    - --enable-tui
    - --with-python=python3
    - --with-babeltrace
    - --with-intel-pt
  artifacts:
  - bin/gdb
  environment:
    CC: gcc
    CXX: g++
    CFLAGS: -g -O2 -fstack-protector-strong -Wformat -Werror=format-security
    CXXFLAGS: -g -O2 -fstack-protector-strong -Wformat -Werror=format-security
    CPPFLAGS: -Wdate-time -D_FORTIFY_SOURCE=2 -fPIC
    LDFLAGS: -Wl,-z,relro
- name: pahole-gdb
  version: master
  stage: data
  source:
    url: https://github.com/PhilArmstrong/pahole-gdb/archive/master.zip
    filename: pahole-gdb-master.zip
    sha256: 7abd613e4dfabeb46d8ef312ef85b280808a369301db21cb7c2b76a6660b53de
  depends_on:
  - gdb
  build:
    system: copy
    copies:
    - from: ${source}
      to: share/pahole-gdb
    after:
    - hook: gdbinit
  artifacts:
  - share/pahole-gdb/pahole.py
  - etc/gdb/gdbinit
- name: cmake
  version: 4.1.1
  stage: core
  source:
    url: https://github.com/Kitware/CMake/releases/download/v4.1.1/cmake-4.1.1.tar.gz
    filename: cmake-4.1.1.tar.gz
    sha256: b29f6f19733aa224b7763507a108a427ed48c688e1faf22b29c44e1c30549282
  depends_on:
  - gcc
  build:
    system: custom
    prepare:
    - hook: cmake_flags
    commands:
    - run:
      - ${source}/bootstrap
      - --prefix=${prefix}
      - --init=${source}/build-flags.cmake
      - --parallel=${jobs}
      - --system-curl
      cwd: ${build}
    - run:
      - make
      - -j${jobs}
      cwd: ${build}
    - run:
      - make
      - install
      cwd: ${build}
  artifacts:
  - bin/cmake
  - bin/ctest
  - bin/cpack
  - bin/ccmake
- name: cppcheck
  version: 2.18.0
  stage: core
  source:
    url: https://github.com/danmar/cppcheck/archive/refs/tags/2.18.0.tar.gz
    filename: cppcheck-2.18.0.tar.gz
    sha256: dc74e300ac59f2ef9f9c05c21d48ae4c8dd1ce17f08914dd30c738ff482e748f
  depends_on:
  - gcc
  build:
    system: make
  artifacts:
  - bin/cppcheck
  - share/cppcheck/cfg
  environment:
    CC: gcc
    CXX: g++
    PREFIX: ${prefix}
    FILESDIR: ${prefix}/share/cppcheck
    CFGDIR: ${prefix}/share/cppcheck/cfg
- name: swig
  version: 4.3.1
  stage: core
  source:
    url: https://github.com/swig/swig/archive/refs/tags/v4.3.1.tar.gz
    filename: swig-4.3.1.tar.gz
    sha256: c6091ef5f2e397945a66899bf6859845f35ef603340e79c086d7f2ecf348678c
  depends_on:
  - gcc
  build:
    system: autotools
    prepare:
    - - ./autogen.sh
  artifacts:
  - bin/swig
- name: llvm
  version: 21.1.0
  stage: core
  source:
    git: https://github.com/llvm/llvm-project.git
    ref: llvmorg-21.1.0
    submodules: true
  depends_on:
  - gcc
  - cmake
  - swig
  build:
    system: cmake
    options:
    - -DCMAKE_C_COMPILER=${prefix}/bin/gcc
    - -DCMAKE_CXX_COMPILER=${prefix}/bin/g++
    - -DCMAKE_CXX_LINK_FLAGS=-L${prefix}/lib64 -Wl,-rpath,${prefix}/lib64
    - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - -DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -DNDEBUG
    - -DCMAKE_CXX_FLAGS=-fuse-ld=gold -fPIC -Wno-unused-command-line-argument -Wno-unknown-warning-option
    - -DCMAKE_C_FLAGS=-fuse-ld=gold -fPIC -Wno-unused-command-line-argument -Wno-unknown-warning-option
    - -DLLVM_ENABLE_PROJECTS=clang;clang-tools-extra;compiler-rt;lldb;lld
    - -DLLVM_ENABLE_RUNTIMES=${llvm_runtimes}
    - -DLLVM_LINK_LLVM_DYLIB=ON
    - -DLLVM_INSTALL_UTILS=ON
    - -DLLVM_VERSION_SUFFIX=
    - -DLLVM_BUILD_LLVM_DYLIB=ON
    - -DLLVM_ENABLE_RTTI=ON
    - -DLLVM_ENABLE_FFI=ON
    - -DLLVM_BINUTILS_INCDIR=${prefix}/include/
    - -DLLVM_INCLUDE_BENCHMARKS=OFF
    - -DLLVM_USE_PERF=yes
    - -DCOMPILER_RT_INCLUDE_TESTS=OFF
    - -DLIBCXX_INCLUDE_BENCHMARKS=OFF
    - -DSWIG_EXECUTABLE=${prefix}/bin/swig
    - -DLLVM_PARALLEL_LINK_JOBS=2
    source_subdir: llvm
  artifacts:
  - bin/clang
  - bin/clang++
  - bin/clang-tidy
  - bin/clang-format
  - bin/clangd
  - bin/lld
  - bin/lldb
- name: zlib
  version: 1.3.1
  stage: library
  source:
    url: https://zlib.net/fossils/zlib-1.3.1.tar.gz
    filename: zlib-1.3.1.tar.gz
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    after:
    - hook: zlib_static
  artifacts:
  - lib/libz.a
  - include/zlib.h
- name: zstd
  version: 1.5.7
  stage: library
  source:
    url: https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
    filename: zstd-1.5.7.tar.gz
    sha256: eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DZSTD_BUILD_PROGRAMS=OFF
    - -DZSTD_BUILD_SHARED=OFF
    - -DZSTD_BUILD_STATIC=ON
    source_subdir: build/cmake
  artifacts:
  - lib/libzstd.a
  - include/zstd.h
- name: lz4
  version: 1.10.0
  stage: library
  source:
    url: https://github.com/lz4/lz4/archive/v1.10.0.tar.gz
    filename: lz4-1.10.0.tar.gz
    sha256: 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b
  depends_on:
  - llvm
  build:
    system: make
    options:
    - BUILD_SHARED=no
    - CC=${compiler_prefix}/bin/clang
  artifacts:
  - lib/liblz4.a
  - include/lz4.h
- name: xz
  version: 5.8.0
  stage: library
  source:
    url: https://tukaani.org/xz/xz-5.8.0.tar.gz
    filename: xz-5.8.0.tar.gz
    sha256: b523c5e47d1490338c5121bdf2a6ecca2bcf0dce05a83ad40a830029cbe6679b
  depends_on:
  - llvm
  build:
    system: autotools
    options:
    - --enable-shared=no
    in_source: true
  artifacts:
  - lib/liblzma.a
  - include/lzma.h
- name: bzip2
  version: 1.0.6
  stage: library
  source:
    url: https://sourceware.org/pub/bzip2/bzip2-1.0.6.tar.gz
    filename: bzip2-1.0.6.tar.gz
    sha256: a2848f34fcd5d6cf47def00461fcb528a0484d8edef8208d6d2e2909dc61d9cd
  depends_on:
  - llvm
  build:
    system: make
    options:
    - BUILD_SHARED=no
    - CC=${compiler_prefix}/bin/clang
    - CFLAGS=-O2 -g -fPIC
  artifacts:
  - lib/libbz2.a
  - include/bzlib.h
- name: boost
  version: 1.89.0
  stage: library
  source:
    url: https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.gz
    filename: boost_1_89_0.tar.gz
    sha256: 9de758db755e8330a01d995b0a24d09798048400ac25c03fc5ea9be364b13c93
  depends_on:
  - llvm
  - zlib
  - bzip2
  build:
    system: custom
    commands:
    - - ./bootstrap.sh
      - --prefix=${prefix}
      - --with-toolset=clang
      - --with-python=python3
      - --without-icu
    - shell: 'args=(); if [[ "$TC_STDLIB" == "libc++" ]]; then args+=("cxxflags=-stdlib=libc++ -fPIC" "linkflags=-stdlib=libc++");
        else args+=("cxxflags=-fPIC --gcc-toolchain=$TC_COMPILER_PREFIX"); fi

        ./b2 toolset=clang -j"$TC_JOBS" install variant=release link=static cxxstd=20 --disable-icu "${args[@]}"
        -sZLIB_SOURCE="$TC_PREFIX" -sZLIB_INCLUDE="$TC_PREFIX/include" -sZLIB_LIBPATH="$TC_PREFIX/lib" -sBZIP2_SOURCE="$TC_PREFIX"
        -sBZIP2_INCLUDE="$TC_PREFIX/include" -sBZIP2_LIBPATH="$TC_PREFIX/lib"'
  artifacts:
  - include/boost/version.hpp
  - lib/libboost_iostreams.a
  - lib/libboost_program_options.a
- name: gflags
  version: 2.2.2
  stage: library
  source:
    url: https://github.com/gflags/gflags/archive/refs/tags/v2.2.2.tar.gz
    filename: gflags-2.2.2.tar.gz
    sha256: 34af2f15cf7367513b352bdcd2493ab14ce43692d2dcd9dfc499492966c64dcf
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - -DREGISTER_INSTALL_PREFIX=OFF
    - -DBUILD_gflags_nothreads_LIB=ON
    - -DBUILD_gflags_LIBS=ON
    - -DGFLAGS_NO_FILENAMES=0
  artifacts:
  - include/gflags/gflags.h
  - lib/libgflags.a
- name: fmt
  version: 11.2.0
  stage: library
  source:
    url: https://github.com/fmtlib/fmt/archive/refs/tags/11.2.0.tar.gz
    filename: fmt-11.2.0.tar.gz
    sha256: bc23066d87ab3168f27cef3e97d545fa63314f5c79df5ea444d41d56f962c6af
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DFMT_TEST=OFF
  artifacts:
  - include/fmt/format.h
  - lib/libfmt.a
- name: spdlog
  version: 1.15.3
  stage: library
  source:
    url: https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz
    filename: spdlog-1.15.3.tar.gz
    sha256: 15a04e69c222eb6c01094b5c7ff8a249b36bb22788d72519646fb85feb267e67
  depends_on:
  - llvm
  build:
    system: cmake
  artifacts:
  - include/spdlog/spdlog.h
  - lib/libspdlog.a
- name: libmodbus
  version: 3.1.11
  stage: library
  source:
    url: https://github.com/stephane/libmodbus/releases/download/v3.1.11/libmodbus-3.1.11.tar.gz
    filename: libmodbus-3.1.11.tar.gz
    sha256: a7a2c4f6e7e3c9bd49a574e9f30f6f87b8f162a58c7a67cb1c75470991b7680a
  depends_on:
  - llvm
  build:
    system: autotools
    options:
    - --enable-static
    - --disable-shared
    in_source: true
  artifacts:
  - include/modbus/modbus.h
  - lib/libmodbus.a
- name: openssl
  version: 3.3.1
  stage: library
  source:
    url: https://www.openssl.org/source/openssl-3.3.1.tar.gz
    filename: openssl-3.3.1.tar.gz
    sha256: 777cd596284c883375a2a7a11bf5d2786fc5413255efab20c50d6ffe6d020b7e
  depends_on:
  - llvm
  build:
    system: custom
    commands:
    - - ./Configure
      - linux-x86_64
      - --prefix=${prefix}
      - --openssldir=${prefix}/ssl
      - --libdir=lib
      - no-shared
      - -fPIC
    - - make
      - -j${jobs}
    - - make
      - install_sw
  artifacts:
  - lib/libssl.a
  - lib/libcrypto.a
  - include/openssl/ssl.h
- name: aws-crt-cpp
  version: v0.33.0
  stage: library
  source:
    git: https://github.com/awslabs/aws-crt-cpp.git
    ref: v0.33.0
    submodules: true
  depends_on:
  - llvm
  - openssl
  build:
    system: cmake
    options:
    - -DUSE_OPENSSL=ON
    - -DDISABLE_AWS_LC=ON
  artifacts:
  - include/aws/crt/Api.h
  - lib/libaws-crt-cpp.a
- name: aws-iot-device-sdk-cpp-v2
  version: v1.42.0
  stage: library
  source:
    git: https://github.com/aws/aws-iot-device-sdk-cpp-v2.git
    ref: v1.42.0
    submodules: true
  depends_on:
  - aws-crt-cpp
  build:
    system: cmake
    options:
    - -DBUILD_SAMPLES=OFF
    - -DBUILD_DEPS=ON
    - -DUSE_OPENSSL=ON
  artifacts:
  - include/aws/iotshadow/IotShadowClient.h
  - lib/libIotShadow-cpp.a
- name: aws-sdk-cpp
  version: 1.11.642
  stage: library
  source:
    git: https://github.com/aws/aws-sdk-cpp
    ref: 1.11.642
    submodules: true
  depends_on:
  - aws-crt-cpp
  - zlib
  build:
    system: cmake
    options:
    - -DBUILD_ONLY=s3;sts;identity-management;iot;iam
    - -DENABLE_IOT_CLIENT=ON
    - -DBUILD_COMMON_RUNTIME=ON
    - -DAUTORUN_UNIT_TESTS=OFF
    - -DENABLE_TESTING=OFF
    - -DCURL_STATICLIB=ON
  artifacts:
  - lib/libaws-cpp-sdk-s3.a
  - lib/libaws-cpp-sdk-sts.a
  - lib/libaws-cpp-sdk-iam.a
  - lib/libaws-cpp-sdk-iot.a
  - include/aws/core/Aws.h
- name: abseil-cpp
  version: '20240722.0'
  stage: library
  source:
    git: https://github.com/abseil/abseil-cpp.git
    ref: '20240722.0'
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DABSL_PROPAGATE_CXX_STD=ON
    - -DABSL_BUILD_TESTING=OFF
    - -DABSL_ENABLE_LOGGING=ON
    - -DABSL_ENABLE_INSTALL=ON
  artifacts:
  - include/absl/base/options.h
  - include/absl/base/nullability.h
  - lib/libabsl_base.a
  - lib/cmake/absl/abslConfig.cmake
- name: protobuf
  version: v6.31.1
  stage: library
  source:
    git: https://github.com/protocolbuffers/protobuf.git
    ref: v6.31.1
    submodules: true
  depends_on:
  - abseil-cpp
  - zlib
  build:
    system: cmake
    options:
    - -Dprotobuf_BUILD_TESTS=OFF
    - -Dprotobuf_WITH_ZLIB=ON
    - -Dprotobuf_ABSL_PROVIDER=package
    - -Dabsl_DIR=${prefix}/lib/cmake/absl
    - -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    - -Dprotobuf_LOCAL_DEPENDENCIES_ONLY=ON
    after:
    - hook: protobuf_headers
  artifacts:
  - bin/protoc
  - lib/libprotobuf.a
  - include/google/protobuf/message.h
  - include/google/protobuf/any.proto
  - lib/cmake/protobuf/protobuf-config.cmake
- name: benchmark
  version: v1.9.4
  stage: library
  source:
    git: https://github.com/google/benchmark.git
    ref: v1.9.4
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DBENCHMARK_ENABLE_TESTING=OFF
  artifacts:
  - lib/libbenchmark.a
  - include/benchmark/benchmark.h
- name: googletest
  version: v1.17.0
  stage: library
  source:
    git: https://github.com/google/googletest.git
    ref: v1.17.0
  depends_on:
  - llvm
  build:
    system: cmake
  artifacts:
  - lib/libgtest.a
  - lib/libgmock.a
  - include/gtest/gtest.h
- name: arrow
  version: apache-arrow-21.0.0
  stage: library
  source:
    git: https://github.com/apache/arrow.git
    ref: apache-arrow-21.0.0
    submodules: true
  depends_on:
  - boost
  - zstd
  - lz4
  - xz
  - protobuf
  build:
    system: cmake
    options:
    - -DARROW_BUILD_SHARED=OFF
    - -DARROW_BUILD_STATIC=ON
    - -DARROW_CSV=ON
    - -DARROW_PARQUET=ON
    - -DARROW_WITH_ZSTD=ON
    - -DARROW_DEPENDENCY_SOURCE=AUTO
    - -DARROW_DEPENDENCY_USE_SHARED=OFF
    - -Dxsimd_SOURCE=BUNDLED
    - -DThrift_SOURCE=BUNDLED
    - -DBOOST_ROOT=${prefix}
    - -DBoost_INCLUDE_DIR=${prefix}/include
    - -DBoost_LIBRARY_DIR=${prefix}/lib
    - -DBoost_NO_SYSTEM_PATHS=ON
    - -DBoost_NO_BOOST_CMAKE=ON
    source_subdir: cpp
  artifacts:
  - lib/libarrow.a
  - lib/libparquet.a
  - include/arrow/api.h
  environment:
    BOOST_ROOT: ${prefix}
    BOOST_INCLUDEDIR: ${prefix}/include
    BOOST_LIBRARYDIR: ${prefix}/lib
- name: bazel
  version: 8.4.1
  stage: data
  source:
    url: https://github.com/bazelbuild/bazel/releases/download/8.4.1/bazel-8.4.1-linux-x86_64
    filename: bazel-8.4.1-linux-x86_64
    unpack: false
  depends_on: []
  build:
    system: copy
    copies:
    - from: ${source}/bazel-8.4.1-linux-x86_64
      to: bin/bazel
      mode: '755'
    after:
    - hook: bazel_wrapper
  artifacts:
  - bin/bazel
  - bin/bazel-cpp
- name: antlr4
  version: 4.13.2
  stage: library
  source:
    git: https://github.com/antlr/antlr4
    ref: 4.13.2
  depends_on:
  - llvm
  build:
    system: cmake
    options:
    - -DANTLR_BUILD_CPP_TESTS=OFF
    - -DANTLR_BUILD_SHARED=OFF
    - -DANTLR_BUILD_STATIC=ON
    - -DANTLR4_INSTALL=ON
    - -DWITH_DEMO=OFF
    source_subdir: runtime/Cpp
  artifacts:
  - lib/libantlr4-runtime.a
  - include/antlr4-runtime/antlr4-runtime.h
- name: googleapis
  version: master
  stage: data
  source:
    git: https://github.com/googleapis/googleapis.git
    ref: master
  depends_on: []
  build:
    system: copy
    copies:
    - from: ${source}/google
      to: include/google
      patterns:
      - '*.proto'
  artifacts:
  - include/google/rpc/status.proto
- name: cel-spec
  version: v0.24.0
  stage: data
  source:
    git: https://github.com/google/cel-spec.git
    ref: v0.24.0
  depends_on: []
  build:
    system: copy
    copies:
    - from: ${source}/proto/cel/expr
      to: include/cel/expr
      patterns:
      - '*.proto'
  artifacts:
  - include/cel/expr/syntax.proto
